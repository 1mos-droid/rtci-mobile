name: Build signed Android release
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'A new build number greater than the last Play release (at least 6)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release
    env:
      RTCI_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Validate release number
        run: python3 -c 'import os; value=os.environ["RTCI_BUILD_NUMBER"]; assert value.isascii() and value.isdecimal() and 6 <= int(value) < 2100000000, "Use a valid new Play build number"'
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: python3 scripts/check_release_config.py
      - run: npm ci --prefix functions
      - run: npm test --prefix functions
      - run: npm audit --prefix functions --audit-level=moderate
      - run: npm install --global firebase-tools@15.27.0
      - run: npm --prefix functions run test:rules
      - name: Prepare signing inputs
        env:
          RTCI_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RTCI_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RTCI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RTCI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 scripts/write_android_signing.py
      - run: flutter build apk --release --no-pub --build-number "$RTCI_BUILD_NUMBER" --obfuscate --split-debug-info=build/debug-symbols
      - run: flutter build appbundle --release --no-pub --build-number "$RTCI_BUILD_NUMBER" --obfuscate --split-debug-info=build/debug-symbols
      - name: Hash release artifacts
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab > build/rtci-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rtci-android-${{ inputs.build_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release/mapping.txt
            build/debug-symbols/
            build/rtci-sha256.txt
          retention-days: 14
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: python3 -c 'from pathlib import Path; [Path(p).unlink(missing_ok=True) for p in ["android/key.properties", "android/app/ci-upload-keystore.jks"]]'
